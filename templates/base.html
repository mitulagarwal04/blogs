<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Daily Notes{% endblock %}</title>
<meta name="description" content="Daily Notes — my personal log. What I'm learning, what I'm building, what I read, and short notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/patty.png">
</head>
<body>
<div class="topbar">
  <a class="wordmark" href="/"><img src="/static/patty.png" alt="">daily notes</a>
  <button class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode">dark</button>
</div>
<main>
{% block content %}{% endblock %}
<footer>
  <span>my personal log · {{ stats.posts if stats is defined else '' }} posts · plain markdown, no database</span>
  <span><a href="/api/posts">api</a></span>
</footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
