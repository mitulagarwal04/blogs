[project]
name = "blogs"
version = "0.2.1"
description = "Daily Notes - a simple warm-paper neo-brutalist daily blog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "markdown>=3.7",
  "pyyaml>=6.0",
  "pygments>=2.21.0",
]

[tool.uv]
managed = true

[dependency-groups]
dev = []
